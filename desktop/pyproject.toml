[project]
name = "orbit-desktop"
version = "0.1.0"
description = "Desktop side of Orbit: mirror and control your phone's live activities"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "zeroconf>=0.132",
    "bleak>=0.22",
    "dbus-fast>=2.21; sys_platform == 'linux'",
]

[project.optional-dependencies]
applet = ["PySide6-Essentials>=6.7"]

[project.scripts]
orbitd = "orbit.daemon.main:main"
orbit = "orbit.cli:main"
orbit-fakephone = "orbit.fakephone.main:main"
orbit-mpris = "orbit.mpris:main"
orbit-applet = "orbit.applet.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "pytest-qt>=4.4", "PySide6-Essentials>=6.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["tools"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["B017", "ASYNC109"]

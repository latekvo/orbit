[project]
name = "orbit-desktop"
version = "0.1.0"
description = "Desktop side of Orbit: mirror and control your phone's live activities"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
]

[project.optional-dependencies]
applet = ["PySide6-Essentials>=6.6"]

[project.scripts]
orbit-applet = "orbit.applet.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-qt>=4.4", "PySide6-Essentials>=6.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

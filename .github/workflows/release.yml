name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android/companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Version from tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Keystore
        env:
          ORBIT_KEYSTORE_B64: ${{ secrets.ORBIT_KEYSTORE_B64 }}
        run: |
          echo "$ORBIT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/orbit.keystore"
          echo "ORBIT_KEYSTORE=$RUNNER_TEMP/orbit.keystore" >> "$GITHUB_ENV"
      - name: Test, lint and build
        env:
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
          ORBIT_KEY_PASSWORD: ${{ secrets.ORBIT_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon -PversionName="$VERSION"
          :protocol:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug :app:assembleRelease
      - name: Check signature
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "orbit-companion-$VERSION.apk"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "orbit-companion-$VERSION.apk" --verify-tag --title "Orbit $GITHUB_REF_NAME" --generate-notes

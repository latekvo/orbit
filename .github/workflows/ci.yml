name: CI

on:
  push:
  pull_request:

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: System libraries for Qt (offscreen) and D-Bus
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0
      - run: uv sync --frozen --extra applet
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: dbus-run-session -- uv run pytest -q tests

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Companion
        working-directory: android/companion
        run: ./gradlew --no-daemon :protocol:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Sample producer
        working-directory: android/sample-producer
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/companion/*/build/reports
            android/companion/app/build/outputs/apk/debug/*.apk
